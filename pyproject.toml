[project]
name = "asrbench"
version = "0.2.0"
description = "ASR benchmarking framework for Chinese speech recognition providers"
authors = [
    { name = "trevorlink", email = "lvpidadiao@hotmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "dashscope>=1.25.6",
    "websockets>=14.0",
    "pydub>=0.25",
    "jiwer>=3.0",
    "jieba>=0.42",
    "rich>=13.0",
    "pyyaml>=6.0",
    "soundfile>=0.13.1",
    "fastapi>=0.161.1",
    "uvicorn[standard]>=0.54.0",
    "python-dotenv>=1.2.4",
    "filelock>=3.25.2",
]

[project.optional-dependencies]
experiments = ["datasets>=4.8.4", "torchcodec>=0.11.0"]

[project.scripts]
asrbench = "asrbench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["asrbench"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
