[project]
name = "asrbench"
version = "0.1.0"
description = "ASR benchmarking framework for Chinese speech recognition providers"
authors = [
    { name = "trevorlink", email = "lvpidadiao@hotmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "dashscope>=1.25.6",
    "websockets>=14.0",
    "tencentcloud-sdk-python>=3.0",
    "pydub>=0.25",
    "jiwer>=3.0",
    "jieba>=0.42",
    "rich>=13.0",
    "pyyaml>=6.0",
    "tencentcloud-speech-sdk-python",
    "datasets>=4.8.4",
    "soundfile>=0.13.1",
    "torchcodec>=0.11.0",
]

[project.scripts]
asrbench = "asrbench.runner:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["asrbench"]

[tool.uv.workspace]
members = [
    "vendor/tencentcloud_speech_sdk",
]

[tool.uv.sources]
tencentcloud-speech-sdk-python = { workspace = true, editable = true }
